name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core and zsh (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats zsh

      - name: Install bats-core (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsSL https://get.chezmoi.io)" -- -b ~/.local/bin
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install starship
        run: |
          curl -sS https://starship.rs/install.sh | sh -s -- --yes -b ~/.local/bin
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Debug credential helper resolution
        if: runner.os == 'Linux'
        run: |
          set -x
          which gh git
          gh --version || true
          env | sort
          mkdir -p /tmp/stubbin
          cat > /tmp/stubbin/gh <<'SH'
          #!/usr/bin/env bash
          echo "STUB gh invoked: $*" >&2
          if [ "$1" = "auth" ] && [ "$2" = "git-credential" ]; then
            cat >/dev/null
            echo "username=x-access-token"
            echo "password=stub-token"
          fi
          SH
          chmod +x /tmp/stubbin/gh
          TMPHOME="$(mktemp -d)"
          HOME="$TMPHOME" XDG_CACHE_HOME="$TMPHOME/cache" chezmoi init --source="$PWD/home" >/dev/null
          HOME="$TMPHOME" chezmoi apply >/dev/null
          echo "--- delivered git config ---"
          cat "$TMPHOME/.config/git/config" || true
          echo "--- resolved credential.helper ---"
          HOME="$TMPHOME" git config --list --show-origin | grep -i credential || true
          echo "--- credential fill ---"
          HOME="$TMPHOME" env PATH="/tmp/stubbin:$PATH" \
            bash -c 'printf "protocol=https\nhost=github.com\n" | git credential fill'

      - name: Run tests
        run: bats tests/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # home/dot_local/bin/executable_chezmoi-drift is a zsh script (#!/usr/bin/env -S zsh -f);
      # shellcheck only supports sh/bash/dash/ksh and errors out (SC1071) on zsh, so it is
      # intentionally excluded here.
      - name: Run shellcheck
        run: shellcheck install.sh
